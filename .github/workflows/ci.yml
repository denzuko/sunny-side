name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: "Runner ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OS: "ubuntu-latest"
      QUICKLISP_DIST: "quicklisp"
      LISP: "sbcl-bin"
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        environment: ["tests", "docs"]
    steps:
      - uses: actions/checkout@v4

      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: ${{ github.event.repository.name }}
          qlfile-or-path: 'qlfile'
          qlot-version: 'v1.8.4'

      - name: Cache Qlot & Roswell Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .qlot
            ~/.roswell
            ~/.cache/common-lisp
          key: ${{ runner.os }}-qlot-${{ hashFiles('qlfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-qlot-

      - name: Install Dependencies
        run: |
          qlot bundle
      
      - name: "Deploy ${{ matrix.environment }} steps"
        if: github.ref_type != 'tag'
        run: ./${{matrix.environment}}.ros
   
      - name: Publish HTML Docs to gh pages
        if: github.ref_type != 'tag' && matrix.environment == 'docs'
        uses: 40ants/build-docs@v1
        with:
          asdf-system: "${{ github.event.repository.name }}/docs"
      - name: "Release source code to github"
        if: github.ref_type == 'tag'
        run: |
          CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9.-]/_/g')
          tar -czvf ${{ github.event.repository.name }}-${CLEAN_REF}.tgz \
            --exclude='.git' \
            --exclude='.github' .
          sha256sum ${{ github.event.repository.name }}-${CLEAN_REF}.tgz > checksum.txt

      - name: Upload Source Bundle to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.event.repository.name }}-*.tgz
            checksum.txt
