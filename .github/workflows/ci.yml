name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  runner:
    name: "Runner ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: ["tests", "docs"]
    steps:
      - uses: actions/checkout@v4
      - uses: 40ants/setup-lisp@v4
      
      - name: "Deploy ${{ matrix.environment }} steps"
        run: ./${{matrix.environment}}.ros
