name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set dps-meta git config
        run: |
          git config meta.application sunny-side
          git config meta.role "Minimal pure-Lisp Gherkin engine, parses .feature files and runs each Scenario as an ordinary FiveAM test"
          git config meta.type lisp-actor
          git config meta.version 1.0.0
          git config meta.branch develop
          git config meta.licence bsd-3-clause
      - uses: denzuko/dps-meta@v1
        with:
          type: lisp-actor
